  async function fetchKoficTMDBAutoComplete(query) {
    try {
      const cleanQuery = query.trim();
      const normalizedQuery = cleanQuery.replace(/\s+/g, '');

      // KOFIC 검색 API가 띄어쓰기 유무에 따라 다른 결과를 줄 때가 있어서,
      // 입력한 그대로 + 띄어쓰기 뺀 버전 둘 다 검색해서 합쳐줌
      // (예: "가능한사랑"으로 검색해도 "가능한 사랑"이 나오도록)
      const buildUrl = (q) => `https://kobis.or.kr/kobisopenapi/webservice/rest/movie/searchMovieList.json?key=${KOFIC_KEY}&movieNm=${encodeURIComponent(q)}&itemPerPage=20`;

      const fetchList = async (q) => {
        try {
          const res = await fetch(buildUrl(q));
          const data = await res.json();
          return data.movieListResult?.movieList || [];
        } catch (e) {
          return [];
        }
      };

      const needsFallback = normalizedQuery !== cleanQuery;
      const [listA, listB] = await Promise.all([
        fetchList(cleanQuery),
        needsFallback ? fetchList(normalizedQuery) : Promise.resolve([])
      ]);

      // movieCd 기준으로 중복 제거하며 합치기
      const seen = new Set();
      const list = [...listA, ...listB].filter(movie => {
        const code = movie.movieCd;
        if (!code || seen.has(code)) return false;
        seen.add(code);
        return true;
      });

      // 입력값과 (띄어쓰기 무시하고) 일치하는 제목을 최우선으로 정렬
      list.sort((a, b) => {
        const titleA = (a.movieNm || '').trim().replace(/\s+/g, '');
        const titleB = (b.movieNm || '').trim().replace(/\s+/g, '');

        if (titleA === normalizedQuery && titleB !== normalizedQuery) return -1;
        if (titleA !== normalizedQuery && titleB === normalizedQuery) return 1;
        return 0;
      });

      const autoBox = document.getElementById('autoCompleteList');

      if (list.length === 0) { autoBox.innerHTML = ''; return hideAutoComplete(); }

      autoBox.innerHTML = list.map(movie => {
        const title = movie.movieNm || '제목 없음';
        const prodYear = movie.prdtYear || '';
        const movieCd = movie.movieCd || '';

        let openDt = '정보 없음';
        if (movie.openDt) {
          const raw = movie.openDt.replace(/-/g, '');
          if (raw.length === 8) {
            openDt = `${raw.substring(0,4)}-${raw.substring(4,6)}-${raw.substring(6,8)}`;
          } else {
            openDt = movie.openDt;
          }
        }

        let director = '정보 없음';
        if (movie.directors && movie.directors.length > 0) {
          director = movie.directors.map(d => d.peopleNm).join(', ');
        }

        const safeTitle = title.replace(/'/g, "\\'");
        const safeDir = director.replace(/'/g, "\\'");

        return `
          <div class="autocomplete-item" onclick="window.selectMovie('${safeTitle}', '${prodYear}', '${openDt}', '${safeDir}', '${movieCd}')">
            <div>
              <div class="auto-title">${title}</div>
              <div class="auto-sub">${prodYear} · 개봉: ${openDt} · 감독: ${director}</div>
            </div>
            <span style="font-size: 0.75rem; color: #b58d53; font-weight:700;">선택</span>
          </div>
        `;
      }).join('');

      autoBox.style.display = 'block';
    } catch (e) {
      console.error('KOFIC 자동완성 실패:', e);
    }
  }

  window.selectMovie = function(movieNm, prodYear, openDt, director, movieCd) {
    const task = fetchMovieMeta(movieNm, prodYear, openDt, director, movieCd);
    pendingMetaFetch = task.finally(() => {
      if (pendingMetaFetch === task) pendingMetaFetch = null;
    });
    return pendingMetaFetch;
  };

  async function fetchMovieMeta(movieNm, prodYear, openDt, director, movieCd) {
    document.getElementById('movieTitle').value = movieNm;
    hideAutoComplete();

    document.getElementById('openDtVal').value = openDt;
    document.getElementById('directorVal').value = director;
    document.getElementById('movieMetaPreview').value = `조회 중... (개봉: ${openDt} | 감독: ${director})`;

    let actors = '정보 없음';
    let posterUrl = DEFAULT_POSTER;

    let targetYear = prodYear || '';
    if (openDt && openDt !== '정보 없음') {
      const yearMatch = openDt.match(/^\d{4}/);
      if (yearMatch) targetYear = yearMatch[0];
    }

    // [수정점 2] 아비정전 등 리마스터 영화 수거를 위한 영화 제목 정제함수
    const cleanMovieTitle = (title) => {
      if (!title) return '';
      return title
        .replace(/\[.*?\]|\(.*?\)/g, '') // 괄호 포함 내용 제거
        .replace(/4k|3d|2d|리마스터링|리마스터|remastered|remastering|디지털|감독판|무삭제판|확장판|재개봉/gi, '') // 수식어 단어 직접 제거
        .replace(/[^a-zA-Z0-9가-힣\s]/g, '') // 특수문자 제거
        .replace(/\s+/g, ' ') // 연속된 공백 정리
        .trim();
    };

    const cleanedSearchTitle = cleanMovieTitle(movieNm) || movieNm;

    await Promise.all([
      (async () => {
        if (!movieCd) return;
        try {
          const detailUrl = `https://kobis.or.kr/kobisopenapi/webservice/rest/movie/searchMovieInfo.json?key=${KOFIC_KEY}&movieCd=${movieCd}`;
          const res = await fetch(detailUrl);
          const data = await res.json();
          const movieInfo = data.movieInfoResult?.movieInfo;
          const actorList = movieInfo?.actors || [];
          if (actorList.length > 0) {
            actors = actorList.slice(0, 3).map(a => a.peopleNm).join(', ');
          }
          // 상영시간(분)도 이 응답에 같이 들어있어서(showTm), 별도 API 호출 없이
          // 여기서 바로 가져다 씀 — TMDB(해외 DB)보다 국내 상영본 기준이라 더 정확함
          if (movieInfo?.showTm) {
            document.getElementById('runtimeMinVal').value = movieInfo.showTm;
          }
        } catch (e) {
          console.error("배우 정보 조회 실패:", e);
        }
      })(),

      (async () => {
        try {
          // 1차 검색: 정제된 제목 + 개봉 연도 조합
          let yearParam = targetYear ? `&primary_release_year=${targetYear}&year=${targetYear}` : '';
          let tmdbUrl = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&language=ko-KR&query=${encodeURIComponent(cleanedSearchTitle)}${yearParam}`;
          let res = await fetch(tmdbUrl);
          let data = await res.json();

          // 2차 검색: 연도 조건 없이 정제된 제목만으로 재시도 (리마스터는 제작/개봉연도가 엇갈릴 수 있음)
          if ((!data.results || data.results.length === 0) && yearParam) {
            tmdbUrl = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&language=ko-KR&query=${encodeURIComponent(cleanedSearchTitle)}`;
            res = await fetch(tmdbUrl);
            data = await res.json();
          }

          // 3차 검색: 정제 전 원본 제목 검색 fallback
          if ((!data.results || data.results.length === 0) && cleanedSearchTitle !== movieNm) {
            tmdbUrl = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&language=ko-KR&query=${encodeURIComponent(movieNm)}`;
            res = await fetch(tmdbUrl);
            data = await res.json();
          }

          if (data.results && data.results.length > 0) {
            let matchedResult = null;
            // 1순위: 포스터가 존재하고 연도가 일치하는 영화
            if (targetYear) {
              matchedResult = data.results.find(r => r.poster_path && r.release_date && r.release_date.startsWith(targetYear));
            }
            // 2순위: 연도 불일치 시에도 포스터가 존재하는 결과 선택
            if (!matchedResult) {
              matchedResult = data.results.find(r => r.poster_path) || data.results[0];
            }

            if (matchedResult && matchedResult.poster_path) {
              posterUrl = `https://image.tmdb.org/t/p/w780${matchedResult.poster_path}`;
            }
          }

          // 4차: TMDB에 끝내 없으면 KMDB(한국영상자료원)에서 마지막으로 시도.
          // "어벤져스: 엔드게임"이 "어벤져스: 엔드게임 앙코르" 같은 재개봉 제목으로만
          // KOFIC에 올라와서 TMDB 검색이 걸리지 않는 경우를 보완하기 위함.
          // TMDB가 이미 찾은 경우엔 이 블록 자체가 실행되지 않으므로 평소 속도엔 영향 없음.
          //
          // 주의: 여기서는 cleanedSearchTitle이 아니라 movieNm(KOFIC 원본 제목)을 그대로
          // 씀. "4K 리마스터링", "재개봉" 같은 수식어는 TMDB(국제 DB) 검색을 방해해서
          // 떼어냈던 거지만, KMDB는 KOFIC과 같은 국내 영화 생태계의 공식 아카이브라
          // 오히려 그 수식어가 붙은 원래 등록 제목 그대로 검색해야 그 재개봉판 항목을
          // 더 정확히 찾아낼 가능성이 높음.
          if (posterUrl === DEFAULT_POSTER) {
            try {
              const kmdbQuery = movieNm;
              const kmdbUrl = `https://api.koreafilm.or.kr/openapi-data2/wisenut/search_api/search_json2.jsp?collection=kmdb_new2&detail=Y&query=${encodeURIComponent(kmdbQuery)}&ServiceKey=${KMDB_KEY}`;
              const kRes = await fetch(kmdbUrl);
              const kData = await kRes.json();
              const kResults = kData?.Data?.[0]?.Result || [];

              // 1순위: 포스터가 있고 제작연도가 일치하는 결과, 2순위: 포스터만 있으면 첫 결과
              let kMatch = null;
              if (targetYear) {
                kMatch = kResults.find(r => r.posters && r.prodYear === targetYear);
              }
              if (!kMatch) {
                kMatch = kResults.find(r => r.posters);
              }

              if (kMatch && kMatch.posters) {
                const firstPoster = kMatch.posters.split('|')[0].trim();
                if (firstPoster) {
                  const thumbUrl = firstPoster.replace(/^http:\/\//, 'https://');

                  // KMDB가 응답으로 주는 posters URL은 썸네일(tn_*)뿐인데, 경로/파일명
                  // 규칙상 "/thm/NN/.../tn_이름.jpg" → "/poster/.../이름_01.jpg" 로 바꾸면
                  // 고화질본일 가능성이 있음(확실히 검증은 못 했고, 파일마다 규칙이
                  // 다를 수도 있음). 그래서 이 URL이 실제로 뜨는지 먼저 확인해보고,
                  // 성공하면 고화질을, 실패하면 원래 썸네일을 그대로 씀 — 최악의
                  // 경우에도 지금 수준(썸네일)보다 나빠지진 않음.
                  const highResUrl = thumbUrl
                    .replace(/\/thm\/\d+\//, '/poster/')
                    .replace(/tn_([^\/]+)\.(\w+)$/i, '$1_01.$2');

                  if (highResUrl !== thumbUrl && await tryLoadImage(highResUrl)) {
                    posterUrl = highResUrl;
                  } else {
                    posterUrl = thumbUrl;
                  }
                }
              }
            } catch (e) {
              console.error("KMDB 포스터 조회 실패:", e);
            }
          }
        } catch (e) {
          console.error("포스터 조회 실패:", e);
        }
      })()
    ]);

    document.getElementById('actorsVal').value = actors;
    document.getElementById('posterUrlVal').value = posterUrl;
    document.getElementById('movieMetaPreview').value = `개봉: ${openDt} | 감독: ${director} | 출연: ${actors}`;

    // 영화를 시작 시간 입력 "이후"에 고른 경우를 위해, 여기서도 한 번 시도함
    autoFillEndTimeFromRuntime();
  }

  function hideAutoComplete() {
    document.getElementById('autoCompleteList').style.display = 'none';
  }

  window.handleTimeInput = function(input, nextId) {
    input.value = input.value.replace(/[^0-9]/g, '');
    if (input.value.length === 2 && nextId) {
      document.getElementById(nextId).focus();
    }

    if (input.id === 'endH' || input.id === 'endM') {
      // 종영 시간을 사용자가 직접 건드림 → 이후로는 자동계산이 이 값을 덮어쓰지 않음
      // (언택트톡, GV 등으로 종영 시간이 러닝타임보다 늘어난 경우 그대로 유지하기 위함)
      endTimeUserEdited = true;
    } else {
      // 시작 시간이 바뀐 경우: 아직 종영 시간을 직접 수정한 적 없다면 다시 자동계산
      autoFillEndTimeFromRuntime();
    }
    calcDuration();
  };

  // "시작 시간 + 광고 10분 + 러닝타임"으로 종영 시간을 자동으로 채움.
  // 시작 시간이 없거나, 러닝타임을 못 구했거나, 사용자가 종영 시간을 이미
  // 직접 수정했으면 아무것도 하지 않음(수동 입력을 절대 덮어쓰지 않음).
  function autoFillEndTimeFromRuntime() {
    if (endTimeUserEdited) return;

    const runtime = parseInt(document.getElementById('runtimeMinVal').value, 10);
    if (!runtime || isNaN(runtime)) return;

    const sH = parseInt(document.getElementById('startH').value, 10);
    const sM = parseInt(document.getElementById('startM').value, 10) || 0;
    if (isNaN(sH)) return;

    const AD_MINUTES = 10; // 광고/예고편 시간
    // 자정을 넘기면 0시로 순환시키지 않고 25시, 26시처럼 이어서 표기함
    // (극장/영수증 표기 관례랑 같게, 그리고 시작-종영 순서가 뒤바뀌어 보이는 걸 방지)
    const endTotal = sH * 60 + sM + AD_MINUTES + runtime;

    const eH = Math.floor(endTotal / 60);
    const eM = endTotal % 60;

    document.getElementById('endH').value = String(eH).padStart(2, '0');
    document.getElementById('endM').value = String(eM).padStart(2, '0');
    calcDuration();
  }

  function calcDuration() {
    const sH = parseInt(document.getElementById('startH').value, 10);
    const sM = parseInt(document.getElementById('startM').value, 10) || 0;
    const eH = parseInt(document.getElementById('endH').value, 10);
    const eM = parseInt(document.getElementById('endM').value, 10) || 0;

    if (isNaN(sH) || isNaN(eH) || sH < 0 || sH > 30 || eH < 0 || eH > 30 || sM < 0 || sM > 59 || eM < 0 || eM > 59) {
      document.getElementById('duration').value = '';
      return;
    }

    const startMins = sH * 60 + sM;
    let endMins = eH * 60 + eM;
    if (endMins < startMins) endMins += 24 * 60;

    const diff = endMins - startMins;
    const hours = Math.floor(diff / 60);
    const mins = diff % 60;

    document.getElementById('duration').value = `${hours > 0 ? hours + '시간 ' : ''}${mins}분`;
  }

  window.saveRecord = async function() {
    if (!currentUser) {
      return Swal.fire({
        title: 'Film Note',
        text: '로그인이 필요합니다.',
        icon: 'warning',
        confirmButtonText: '확인',
        confirmButtonColor: '#f2ebd9'
      });
    }
    if (isSaving) return;

    const title = document.getElementById('movieTitle').value.trim();
    if (!title) {
      return Swal.fire({
        title: 'Film Note',
        text: '영화 제목을 입력하세요.',
        icon: 'info',
        confirmButtonText: '확인',
        confirmButtonColor: '#f2ebd9'
      });
    }

    const editId = document.getElementById('editRecordId').value;
    const saveBtn = document.getElementById('saveBtn');

    // 영화를 방금 고른 직후라면 포스터/출연 정보를 받아오는 중일 수 있음.
    // 이걸 안 기다리면 포스터가 빠진 채로 저장되는 경우가 생겨서, 최대 3초만 기다림.
    if (pendingMetaFetch) {
      if (saveBtn) saveBtn.innerText = '영화 정보 확인 중...';
      await Promise.race([
        pendingMetaFetch,
        new Promise(resolve => setTimeout(resolve, 3000))
      ]);
    }
    if (saveBtn) saveBtn.innerText = '저장 중...';

    const date = document.getElementById('selectedDate').value;

    const sH = document.getElementById('startH').value;
    const sM = document.getElementById('startM').value;
    const eH = document.getElementById('endH').value;
    const eM = document.getElementById('endM').value;

    const startTime = (sH !== '') ? `${sH.padStart(2, '0')}:${(sM || '00').padStart(2, '0')}` : '';
    const endTime = (eH !== '') ? `${eH.padStart(2, '0')}:${(eM || '00').padStart(2, '0')}` : '';

    const rawPrice = document.getElementById('ticketPrice').value.replace(/,/g, '').trim();
    const parsedPrice = rawPrice !== '' ? Number(rawPrice) : 0;

    const cinemaChain = document.getElementById('cinemaChain').value;
    const cinemaBranch = document.getElementById('cinemaBranch').value.trim();
    const cinema = cinemaBranch ? `${cinemaChain} ${cinemaBranch}` : cinemaChain;

    const recordData = {
      uid: currentUser.uid,
      date: date,
      title: title,
      cinema: cinema,
      screenType: document.getElementById('screenType').value,
      seatNumber: document.getElementById('seatNumber').value.trim(),
      ticketPrice: parsedPrice,
      promotion: document.getElementById('promotion').value,
      startTime: startTime,
      endTime: endTime,
      duration: document.getElementById('duration').value,
      openDt: document.getElementById('openDtVal').value,
      director: document.getElementById('directorVal').value,
      actors: document.getElementById('actorsVal').value,
      poster: document.getElementById('posterUrlVal').value.trim() || DEFAULT_POSTER,
      createdAt: editId ? (movieLogs.find(l => l.id === editId)?.createdAt || Date.now()) : Date.now()
    };

    // ⚠️ 저장이 가끔 아주 오래 걸리던 원인:
    // setDoc/addDoc의 Promise는 "서버가 받았다"고 응답할 때 풀린다.
    // 그런데 Firestore는 쓰기를 이미 로컬에 즉시 반영하고 onSnapshot도 바로 쏴준다.
    // 즉 화면상으로는 저장이 끝났는데, await 때문에 서버 왕복(네트워크 상태에 따라
    // 수 초~수십 초)을 다 기다린 뒤에야 모달이 닫히고 있었음.
    // 이제 기다리지 않고 바로 닫고, 동기화는 백그라운드에서 진행함.
    try {
      isSaving = true;

      const writePromise = editId
        ? setDoc(doc(db, "movieLogs", editId), recordData, { merge: true })
        : addDoc(collection(db, "movieLogs"), recordData);

      // 실패했을 때만 알려주기 (오프라인이면 온라인 복귀 시 자동으로 동기화됨)
      writePromise.catch(e => {
        console.error("저장 중 오류 발생:", e);
        Swal.fire({
          title: 'Film Note',
          text: '저장 내용을 서버에 반영하지 못했습니다. 네트워크 상태를 확인해주세요.',
          icon: 'error',
          confirmButtonText: '확인',
          confirmButtonColor: '#f2ebd9'
        });
      });
    } finally {
      isSaving = false;
      if (saveBtn) saveBtn.innerText = editId ? '기록 수정하기' : '기록 저장하기';
      window.closeAllModals();
    }
  };

  // 공공데이터포털 특일 정보 API 호출 함수
  const API_KEY = '8e42e2ef37797a08deaedbcfc1e57ac81cf7a7994bf84799da651595082929cc';
  const HOLIDAY_CACHE_KEY = 'filmNote_holidayCache_v1';

  // 공휴일 결과를 localStorage에 캐싱 (월별로, 앱을 재방문해도 API를 다시 부르지 않도록)
  function loadHolidayCache() {
    try {
      return JSON.parse(localStorage.getItem(HOLIDAY_CACHE_KEY) || '{}');
    } catch (e) {
      return {};
    }
  }
  function saveHolidayCache(cache) {
    try {
      localStorage.setItem(HOLIDAY_CACHE_KEY, JSON.stringify(cache));
    } catch (e) {}
  }
  const holidayMemCache = loadHolidayCache();
  const holidayInFlight = {};   // 같은 달을 동시에 여러 번 요청하지 않도록

  async function fetchHolidays(year, month) {
    const formattedMonth = String(month + 1).padStart(2, '0');
    const url = `https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService/getHoliDeInfo?serviceKey=${API_KEY}&solYear=${year}&solMonth=${formattedMonth}`;

    try {
      const res = await fetch(url);
      const xmlText = await res.text();
       const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "text/xml");
      const items = xmlDoc.getElementsByTagName("item");

      const holidays = [];
      for (let i = 0; i < items.length; i++) {
        const isHoliday = items[i].getElementsByTagName("isHoliday")[0]?.textContent;
        const locdate = items[i].getElementsByTagName("locdate")[0]?.textContent;

        if (isHoliday === "Y" && locdate) {
          const formattedDate = `${locdate.substring(0, 4)}-${locdate.substring(4, 6)}-${locdate.substring(6, 8)}`;
          holidays.push(formattedDate);
        }
      }
      return holidays;
    } catch (e) {
      console.error('공휴일 API 실패:', e);
      return [];
    }
  }

  // 캐시가 있으면 즉시 반환하고, 없거나 오래됐으면 백그라운드에서 갱신 후 콜백으로 전달
  function getHolidaysWithCache(year, month, onUpdated) {
    const key = `${year}-${month}`;
    const cached = holidayMemCache[key];

    if (cached) {
      // 예전에는 캐시가 있어도 렌더할 때마다 API를 다시 불렀는데,
      // renderCalendar()는 기록이 바뀔 때마다 실행되다 보니 불필요한 요청이 계속 나갔음.
      // 지난 달의 공휴일은 바뀌지 않으므로 아예 다시 부르지 않고,
      // 이번 달 이후만 30일이 지난 캐시일 때 한 번씩 갱신함.
      const now = new Date();
      const isPast = (year < now.getFullYear()) ||
                     (year === now.getFullYear() && month < now.getMonth());
      const isStale = (Date.now() - (cached.ts || 0)) > 30 * 24 * 60 * 60 * 1000;

      if (!isPast && isStale && !holidayInFlight[key]) {
        holidayInFlight[key] = true;
        fetchHolidays(year, month).then(fresh => {
          const changed = JSON.stringify(fresh) !== JSON.stringify(cached.list);
          holidayMemCache[key] = { list: fresh, ts: Date.now() };
          saveHolidayCache(holidayMemCache);
          if (changed) onUpdated(fresh);
        }).catch(() => {}).finally(() => { holidayInFlight[key] = false; });
      }
      return cached.list;
    }

    if (holidayInFlight[key]) return [];   // 이미 요청 중이면 중복 호출 방지

    // 캐시 없음: 우선 빈 배열로 즉시 렌더링, 응답 오면 업데이트
    holidayInFlight[key] = true;
    fetchHolidays(year, month).then(fresh => {
      holidayMemCache[key] = { list: fresh, ts: Date.now() };
      saveHolidayCache(holidayMemCache);
      onUpdated(fresh);
    }).catch(() => {}).finally(() => { holidayInFlight[key] = false; });
    return [];
  }

  let lastRenderedMonthKey = null;

  // 달력 데이터가 바뀔 때마다(기록 추가/수정/삭제/이동) grid.innerHTML을 통째로
  // 새로 만들면, 안 바뀐 칸들까지 전부 파괴됐다가 다시 그려지면서 브라우저가
  // 그 프레임에 화면을 다시 페인트하고, 그게 눈에는 "깜빡임"으로 보임.
  // 그래서 같은 달을 계속 보고 있는 상태에서는(달 넘김이 아니라면) 새로 만든
  // HTML과 지금 화면에 있는 칸들을 자리별로 비교해서, 실제로 내용이 달라진
  // 칸만 콕 집어 교체함 — 나머지 대부분의 칸은 손대지 않으니 화면이 안정적임.
  function patchGridCells(gridEl, newHtml) {
    const temp = document.createElement('div');
    temp.innerHTML = newHtml;
    const newNodes = Array.from(temp.children);
    const oldNodes = Array.from(gridEl.children);
    const len = Math.max(newNodes.length, oldNodes.length);

    for (let i = 0; i < len; i++) {
      const newNode = newNodes[i];
      const oldNode = oldNodes[i];
      if (!newNode) {
        if (oldNode) oldNode.remove();
        continue;
      }
      if (!oldNode) {
        gridEl.appendChild(newNode);
        continue;
      }
      if (oldNode.outerHTML !== newNode.outerHTML) {
        gridEl.replaceChild(newNode, oldNode);
      }
    }
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    // 공휴일 API 응답을 기다리지 않고 캐시(또는 빈 값)로 즉시 렌더링
    // 최신 공휴일 정보가 도착하면 같은 달을 보고 있을 때만 조용히 다시 그림.
    // 단, 이 응답은 사용자가 지금 뭘 하고 있는지와 무관하게 아무 때나 도착하므로,
    // 하필 드래그하는 도중에 도착하면 그 순간 화면이 다시 그려지며 깜빡이는
    // 원인이 됐음 — 드래그 중이면 지금 당장 그리지 않고 표시만 해뒀다가,
    // 드래그가 끝나는 시점(dndCleanup)에 한 번만 반영되게 미룸.
    const holidayList = getHolidaysWithCache(year, month, (freshList) => {
      if (currentDate.getFullYear() === year && currentDate.getMonth() === month) {
        if (dndUIReady && (dnd.active || dnd.suspendRerender)) {
          dnd.pendingRerender = true;
        } else {
          renderCalendar();
        }
      }
    });

    document.getElementById('calendar-title').innerText = `${year}. ${month + 1}`;
    const grid = document.getElementById('calendar-grid');
    let gridHtml = '';

    ['일','월','화','수','목','금','토'].forEach(n => {
      gridHtml += `<div class="day-name">${n}</div>`;
    });

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const holidaySet = new Set(holidayList);   // includes() 반복 대신 Set 조회

    for (let i = 0; i < firstDay; i++) gridHtml += `<div class="empty-cell"></div>`;

    const now = new Date();
    const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    let monthLogCount = 0;
    let monthlyTotalCost = 0;
    let monthlyTotalMinutes = 0;

    for (let date = 1; date <= lastDate; date++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
      const logs = logsOfDate(dateStr);
    // 요일 및 공휴일 판별 (API 활용)
      const targetDate = new Date(year, month, date);
      const dayOfWeek = targetDate.getDay(); // 0: 일요일, 6: 토요일

      const isHoliday = holidaySet.has(dateStr);

      let dateColorClass = '';
      if (dayOfWeek === 0 || isHoliday) {
        dateColorClass = 'text-red';  // 일요일, 대체공휴일, 국경일 등
      } else if (dayOfWeek === 6) {
        dateColorClass = 'text-blue'; // 토요일
      }
      monthLogCount += logs.length;

      logs.forEach(l => {
        monthlyTotalCost += Number(l.ticketPrice || 0);

        if (l.startTime && l.endTime) {
          const [sH, sM] = l.startTime.split(':').map(Number);
          const [eH, eM] = l.endTime.split(':').map(Number);
          if (!isNaN(sH) && !isNaN(eH)) {
            const startMins = sH * 60 + (sM || 0);
            let endMins = eH * 60 + (eM || 0);
            if (endMins < startMins) endMins += 24 * 60;
            const diff = endMins - startMins;
            if (diff > 0) monthlyTotalMinutes += diff;
          }
        }
      });

      const isToday = dateStr === todayStr ? 'today' : '';
      let styleAttr = '';
      let badgeHtml = '';
      let extraClass = dateColorClass;

      if (logs.length > 0) {
        const sortedLogs = sortLogsByTime(logs);
        const mainLog = logs.find(l => l.isMainPoster) || sortedLogs[0];
        
        if (mainLog && mainLog.poster && mainLog.poster !== DEFAULT_POSTER) {
          // 달력 칸은 실제로 60px 안팎이라 w185면 충분함 (원본 w780 대비 데이터가 1/10 수준)
          styleAttr = `style="background-image: url('${posterAt(mainLog.poster, 'w185')}');"`;
        } else {
          extraClass = 'has-record-no-poster';
        }
        
        if (logs.length > 1) {
          badgeHtml = `<div class="count-badge">${logs.length}</div>`;
        }
      }

      gridHtml += (dndUIReady && dnd.active && dnd.fromDate === dateStr && dnd.sourceNode)
        ? `<div class="dnd-placeholder" data-date="${dateStr}"></div>`
        : `
        <div class="day-cell ${isToday} ${extraClass} ${logs.length > 0 ? 'draggable-day' : ''}" data-date="${dateStr}" ${styleAttr} onclick="window.handleDateClick('${dateStr}')">
          <span class="day-number">${date}</span>
          ${badgeHtml}
        </div>
      `;
    }

    // 달을 넘길 때만 페이드인. (기록이 저장/수정될 때마다 화면이 깜빡이던 것 방지)
    const monthKey = `${year}-${month}`;
    const monthChanged = lastRenderedMonthKey !== monthKey;
    lastRenderedMonthKey = monthKey;

    // 이 렌더링에서 그 칸이 다시 그려지는 경우, 실제 DOM을 통째로 없앴다가 새로
    // 만들면 (a) 터치 이벤트가 묶여있던 원래 노드가 사라지고 (b) grid가 빈 자리를
    // 채우며 뒤 칸들이 밀리는 문제가 있었음. 그래서 grid.innerHTML을 지우기 전에,
    // 아직 grid 안에 남아있는 원래 노드를 먼저 안전한 곳으로 잠깐 빼둔다.
    // (이 대피 로직은 드래그 중일 때만 필요하므로, 아래에서 그 경로일 때만 사용)
    const isDragActive = dndUIReady && dnd.active;

    if (monthChanged) {
      // 달이 실제로 바뀐 경우에만 전체 교체 + 페이드 (이럴 땐 어차피 칸 대부분이 다 다름)
      if (isDragActive && dnd.sourceNode && dnd.sourceNode.parentElement === grid) {
        dndHolder.appendChild(dnd.sourceNode);
      }
      grid.style.opacity = '0';
      grid.innerHTML = gridHtml;
      requestAnimationFrame(() => { grid.style.opacity = '1'; });
      if (isDragActive && dnd.sourceNode) {
        const placeholder = grid.querySelector('.dnd-placeholder');
        if (placeholder) placeholder.replaceWith(dnd.sourceNode);
      }
    } else if (isDragActive) {
      // 드래그 중에 같은 달 안에서 다시 그려야 하는 특수한 경우(거의 발생 안 함).
      // 대피 로직이 필요하므로 기존처럼 통째로 교체함.
      if (dnd.sourceNode && dnd.sourceNode.parentElement === grid) {
        dndHolder.appendChild(dnd.sourceNode);
      }
      grid.innerHTML = gridHtml;
      if (dnd.sourceNode) {
        const placeholder = grid.querySelector('.dnd-placeholder');
        if (placeholder) placeholder.replaceWith(dnd.sourceNode);
      }
    } else {
      // 평범하게 기록이 추가/수정/삭제/이동된 경우: 바뀐 칸만 콕 집어 교체
      patchGridCells(grid, gridHtml);
    }

    document.getElementById('monthlyTotalCost').innerText = monthlyTotalCost.toLocaleString();

    const hours = Math.floor(monthlyTotalMinutes / 60);
    const mins = monthlyTotalMinutes % 60;
    document.getElementById('monthlyTotalTime').innerText = hours > 0 ? `${hours}시간 ${mins}분` : `${mins}분`;

    const summaryText = document.getElementById('month-summary');
    if (!currentUser && !usingCachedLogs) {
      summaryText.innerText = '로그인하면 관람 기록을 볼 수 있어요.';
    } else {
      // "총 n편" 부분만 색/굵기로 강조
      summaryText.innerHTML = monthLogCount > 0
        ? `이번 달 <b class="summary-highlight">총 ${monthLogCount}편</b>의 영화를 기록했어요.`
        : '이번 달 관람 기록이 없어요';
    }
  }

  window.changeMonth = function(d) { currentDate.setMonth(currentDate.getMonth() + d); renderCalendar(); };
  window.goToday = function() { currentDate = new Date(); renderCalendar(); };

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.form-group')) {
      hideAutoComplete();
    }
  });

  // 항상 즉시 렌더링: 달력 구조는 바로 뜨고, 실제 기록 데이터는 도착하는 대로
  // 부드럽게 페이드인되도록 처리함 (renderCalendar 내부의 opacity 트랜지션 참고)
  renderCalendar();

  // SweetAlert2는 이 페이지에서 팝업을 "처음" 띄우는 그 순간에, 스타일시트 주입이나
  // 내부 DOM 컨테이너 준비 같은 1회성 초기화 비용을 그때서야 치름. 사이트에 막
  // 접속해서 바로 기록을 옮기면 하필 그 첫 팝업(옮길까요?)이 이 비용을 떠안게 되어,
  // 다른 데이터 변경과 안 겹쳐도 그 자체로 버벅임/깜빡임처럼 보였던 것으로 보임.
  // 그래서 페이지가 뜨고 잠깐 뒤(중요한 첫 렌더링을 막지 않는 시점)에, 화면에
  // 전혀 보이지 않는 팝업을 한 번 열었다 바로 닫아서 이 초기화 비용을 미리 치러둠.
  setTimeout(() => {
    try {
      Swal.fire({
        html: '',
        showConfirmButton: false,
        backdrop: false,
        allowOutsideClick: false,
        allowEscapeKey: false,
        showClass: { popup: '' }, // 등장 애니메이션 생략 → 컨테이너가 화면에 남아있는 시간을 최소화
        hideClass: { popup: '' }, // 퇴장 애니메이션도 생략 → didOpen에서 닫자마자 즉시 사라짐
        willOpen: (popup) => {
          popup.style.visibility = 'hidden';
          // 혹시 이 짧은 순간에 사용자가 다른 곳을 클릭/터치하더라도 그대로 통과되도록,
          // 화면 전체를 덮는 컨테이너 레이어 자체를 클릭 통과 상태로 만들어둠.
          const container = popup.closest('.swal2-container');
          if (container) container.style.pointerEvents = 'none';
        },
        didOpen: () => { Swal.close(); }
      });
    } catch (e) { /* SweetAlert2 예열 실패는 무시해도 되는 최적화일 뿐 */ }
  }, 300);

// 모바일 좌우 스와이프 달력 넘김 기능 추가
const calendarBody = document.getElementById('calendar-grid');
if (calendarBody) {
  let startX = 0;
  let endX = 0;

  calendarBody.addEventListener('touchstart', (e) => {
    if (dnd.active) return;
    startX = e.touches[0].clientX;
  }, { passive: true });

  calendarBody.addEventListener('touchend', (e) => {
    // 기록을 드래그해서 옮기는 중이면 달 넘김(스와이프)은 무시
    if (dnd.active || dnd.suppressClick) return;
    endX = e.changedTouches[0].clientX;
    const diffX = startX - endX;
    const threshold = 50; // 50px 이상 쓸어넘겼을 때 동작

    if (diffX > threshold) {
      // 오른쪽에서 왼쪽으로 (다음달)
      window.changeMonth(1);
    } else if (diffX < -threshold) {
      // 왼쪽에서 오른쪽으로 (이전달)
      window.changeMonth(-1);
    }
  }, { passive: true });
}
  

// ===================== 날짜 드래그 이동 (PC 마우스 + 모바일 터치) =====================
// PC: 기록이 있는 날짜를 마우스로 집어서 끌면 됨.
// 모바일: 살짝 길게 누르면(약 0.4초) 집히고, 그대로 손가락을 움직여서 옮김.
//         (짧게 누르면 기존처럼 목록이 열리고, 바로 쓸어 넘기면 달 이동이 그대로 동작)
// 그 날짜의 기록은 우선 '통째로' 집히고, 놓은 뒤에 여러 개면 어떤 걸 옮길지 물어봄.
  const dnd = {
    active: false,        // 실제로 끌고 있는 중인지
    pending: false,       // 누르긴 했는데 아직 드래그 시작 전인지
    fromDate: null,
    ghost: null,
    startX: 0, startY: 0,
    isTouch: false,
    longPressTimer: null,
    overCell: null,
    suppressClick: false, // 드래그 직후 날짜 클릭(모달 열림) 방지
    edgeTimer: null,
    edgeBtn: null,
    sourceNode: null,      // 드래그 시작한 실제 day-cell DOM 노드 (통째로 보존/복원 대상)
    pendingRerender: false, // 드래그(또는 그 뒤 확인 팝업) 중에 미뤄둔 재렌더링이 있는지
    // 손가락/마우스를 뗀 순간(active=false) 이후에도 "옮길까요?" 확인 팝업이
    // 열려있는 동안에는 계속 재렌더링을 미뤄야 함. 이게 없으면 팝업이 떠있는 사이에
    // (예: 방금 추가한 기록의 포스터 정보가 뒤늦게 도착해 저장되는 등) 데이터가 한 번이라도
    // 바뀌면 그 순간 달력 전체가 다시 그려지면서 팝업 뒤에서 화면이 깜빡이는 원인이 됐음.
    suspendRerender: false,
    // transition을 꺼둔 채로 확인 팝업으로 넘어간 칸들. 팝업이 실제로 화면에 완전히
    // 열린 뒤에 복구해야 함 (너무 일찍 복구하면 팝업이 그 칸을 덮으면서 생기는
    // hover 상태 변화가 애니메이션으로 그대로 재생되어 화면이 반짝여 보였음)
    pendingTransitionCells: null
  };

  const DND_MOUSE_THRESHOLD = 8;   // 마우스가 이만큼 움직이면 드래그로 인정
  const DND_LONG_PRESS_MS = 400;   // 터치: 이만큼 누르고 있으면 드래그 시작
  const DND_TOUCH_SLOP = 12;       // 누르자마자 이만큼 움직이면 스크롤/스와이프로 판단

  function dndEscape(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function dndCellByDate(dateStr) {
    return document.querySelector('.day-cell[data-date="' + dateStr + '"]');
  }

  function dndLogsOf(dateStr) {
    return logsOfDate(dateStr);
  }

  // 터치 이벤트는 touchstart가 일어난 DOM 노드에 끝까지 묶여서 전달됨(손가락이
  // 이동해도 target은 그대로). 그런데 드래그 중 달을 넘기면 renderCalendar()가
  // calendar-grid를 통째로 새로 그리면서, 처음 터치를 시작한 날짜 칸까지 파괴되어
  // 문서에서 완전히 떨어져 나감(detached). 분리된 노드로 전달되는 touchmove/
  // touchend/touchcancel은 document까지 버블링될 길이 없어서 우리 코드가 더 이상
  // 손을 뗐는지 알 수 없게 되고, 결과적으로 달이 무한정 계속 넘어가 버림.
  // 그래서 드래그 중에는 그 칸을 지우지 않고, 화면 밖의 숨김 보관함으로 옮겨서
  // "문서에는 붙어있지만 안 보이는" 상태로 유지함 (터치 이벤트 수신은 계속됨).
  const dndHolder = document.createElement('div');
  dndHolder.style.cssText = 'position:fixed; left:-9999px; top:-9999px; width:0; height:0; overflow:hidden; pointer-events:none;';
  document.body.appendChild(dndHolder);
  dndUIReady = true;

  function dndBegin(fromDate, x, y) {
    const logs = dndLogsOf(fromDate);
    if (logs.length === 0) { dnd.pending = false; return; }

    dnd.active = true;
    dnd.pending = false;
    dnd.fromDate = fromDate;
    dnd.suspendRerender = true;
    document.body.classList.add('dnd-active');

    const sorted = sortLogsByTime(logs);
    const mainLog = logs.find(l => l.isMainPoster) || sorted[0];

    const ghost = document.createElement('div');
    ghost.className = 'drag-ghost';
    if (mainLog && mainLog.poster && mainLog.poster !== DEFAULT_POSTER) {
      ghost.style.backgroundImage = "url('" + posterAt(mainLog.poster, 'w185') + "')";
    }
    if (logs.length > 1) {
      ghost.innerHTML = '<span class="drag-ghost-count">' + logs.length + '</span>';
    }
    ghost.style.left = x + 'px';
    ghost.style.top = y + 'px';
    document.body.appendChild(ghost);
    dnd.ghost = ghost;

    const src = dndCellByDate(fromDate);
    if (src) {
      src.classList.add('drag-source');
      // 예전엔 여기서 바로 숨김 보관함으로 옮겼는데, 그러면 드래그를 시작하는
      // 순간부터 달력 그리드에 구멍이 생겨서(그 칸이 없어짐) CSS grid가 뒤 칸들을
      // 한 칸씩 당겨 채우며 요일/공휴일 색상이 전부 밀려 보이는 문제가 있었음.
      // 이제는 칸을 제자리에 그대로 둔 채로 참조만 저장해두고, 실제로 그 칸이
      // 통째로 다시 그려질 위기(달을 넘기는 등)에 처했을 때만 renderCalendar()
      // 쪽에서 필요한 순간에 잠깐 대피시켰다가 제자리로 복원함 (아래 renderCalendar 참고).
      dnd.sourceNode = src;
    }

    if (dnd.isTouch && navigator.vibrate) {
      try { navigator.vibrate(25); } catch (e) {}
    }
  }

  function dndUpdate(x, y) {
    if (!dnd.active) return;
    if (dnd.ghost) {
      dnd.ghost.style.left = x + 'px';
      dnd.ghost.style.top = y + 'px';
    }

    const el = document.elementFromPoint(x, y);
    const cell = el && el.closest ? el.closest('.day-cell') : null;

    if (dnd.overCell && dnd.overCell !== cell) {
      dnd.overCell.classList.remove('drag-over');
      dnd.overCell = null;
    }
    if (cell && cell.dataset.date && cell.dataset.date !== dnd.fromDate) {
      cell.classList.add('drag-over');
      dnd.overCell = cell;
    }

    // 드래그한 채로 이전/다음 달 버튼 위에 잠깐 머무르면 달을 넘겨줌 (다른 달로 옮기기)
    const navBtn = el && el.closest ? el.closest('.btn-circle[data-month-step]') : null;
    if (navBtn !== dnd.edgeBtn) {
      clearTimeout(dnd.edgeTimer);
      if (dnd.edgeBtn) dnd.edgeBtn.classList.remove('drag-hot');
      dnd.edgeBtn = navBtn;
      if (navBtn) {
        navBtn.classList.add('drag-hot');
        const step = Number(navBtn.dataset.monthStep) || 0;
        let flipCount = 0;
        const MAX_AUTO_FLIPS = 24; // 안전장치: 어떤 이유로든 멈추지 않는 상황을 대비한 상한(2년치)
        const tick = () => {
          if (!dnd.active || dnd.edgeBtn !== navBtn) return;
          if (++flipCount > MAX_AUTO_FLIPS) { dndCleanup(); return; }
          window.changeMonth(step);
          dnd.edgeTimer = setTimeout(tick, 850);
        };
        dnd.edgeTimer = setTimeout(tick, 550);
      }
    }
  }

  function dndCleanup(keepSuspended) {
    clearTimeout(dnd.longPressTimer);
    clearTimeout(dnd.edgeTimer);
    if (dnd.ghost) dnd.ghost.remove();
    if (dnd.edgeBtn) dnd.edgeBtn.classList.remove('drag-hot');

    // drag-over였던 칸(scale 1.05 + 점선 테두리)이 원래 모습으로 돌아갈 때
    // .day-cell 기본 transition(transform/border-color)이 애니메이션을 태우는데,
    // 바로 그 순간 옮길 기록을 고르는 팝업이 열리면서 겹쳐 보여 깜빡이는 것처럼 느껴졌음.
    // 여기서만 transition을 잠깐 꺼서 즉시 원상복구되게 함.
    const cellsToReset = document.querySelectorAll('.day-cell.drag-source, .day-cell.drag-over');
    cellsToReset.forEach(c => { c.style.transition = 'none'; });
    if (dnd.overCell) dnd.overCell.classList.remove('drag-over');
    document.querySelectorAll('.day-cell.drag-source').forEach(c => c.classList.remove('drag-source'));
    document.querySelectorAll('.day-cell.drag-over').forEach(c => c.classList.remove('drag-over'));

    document.body.classList.remove('dnd-active');

    const neededRestore = dndHolder.children.length > 0;
    dndHolder.innerHTML = ''; // 보관함에 대피시켜뒀을 수도 있는 옛 노드 정리
    dnd.active = false;
    dnd.pending = false;
    dnd.ghost = null;
    dnd.overCell = null;
    dnd.edgeBtn = null;
    dnd.fromDate = null;
    dnd.sourceNode = null;

    // keepSuspended가 true면(= 이제 "옮길까요?" 확인 팝업으로 넘어가는 경우)
    // 재렌더링 억제를 여기서 풀지 않고 그대로 켜둔 채로 둠. 그 사이 들어오는
    // 데이터 변경은 계속 pendingRerender로만 쌓이고, 팝업이 완전히 끝난 뒤
    // (handleDayDrop의 finally)에 딱 한 번만 반영됨 — 팝업 뒤에서 달력이
    // 다시 그려지며 깜빡이던 문제의 원인이 바로 이 타이밍이었음.
    if (keepSuspended) {
      // transition 복구도 마찬가지 이유로 다음 프레임이 아니라 팝업이 실제로 완전히
      // 열린 뒤(handleDayDrop 쪽에서 Swal의 didOpen 시점에)로 미룸. 실제로 Performance
      // 탭으로 찍어보니, 다음 프레임에 바로 복구했을 때 SweetAlert2 팝업 배경이 이
      // 칸을 덮으면서 생기는 hover 상태 변화가 (이미 복구된) transition을 타고
      // 그대로 애니메이션 재생되어 화면이 반짝여 보였던 게 확인됐음. 팝업이 다 열린
      // 뒤에 복구하면 그 애니메이션이 재생돼도 이미 팝업 배경에 가려 안 보임.
      dnd.pendingTransitionCells = cellsToReset;

      // 다만 드래그 중 달을 넘겨서(엣지 자동 넘김) 대피시켜뒀던 칸이 있다면,
      // 그건 확인 팝업이 뜨기 전인 지금 바로 복원해야 함 (안 그러면 달력이
      // 깨진 채로 팝업이 열림). 이 렌더링은 팝업보다 먼저 끝나므로 겹쳐 보일 일이 없음.
      if (neededRestore) renderCalendar();
      return;
    }

    // 확인 팝업으로 넘어가지 않는 경우(취소/제자리 드롭 등)엔 다음 프레임에 바로 복구
    requestAnimationFrame(() => {
      cellsToReset.forEach(c => { c.style.transition = ''; });
    });

    const hadPendingRerender = dnd.pendingRerender;
    dnd.pendingRerender = false;
    dnd.suspendRerender = false;

    if (neededRestore || hadPendingRerender) renderCalendar();
  }

  // dndCleanup에서 transition:none인 채로 넘겨받은 칸들을, 팝업이 실제로 화면에
  // 열린 뒤(Swal의 didOpen) 안전하게 복구함. 여러 번 호출돼도 안전(idempotent).
  function flushPendingCellTransitions() {
    if (dnd.pendingTransitionCells) {
      dnd.pendingTransitionCells.forEach(c => { c.style.transition = ''; });
      dnd.pendingTransitionCells = null;
    }
  }

  function dndFinish(x, y) {
    if (!dnd.active) { dndCleanup(); return; }

    const fromDate = dnd.fromDate;
    const el = document.elementFromPoint(x, y);
    const cell = el && el.closest ? el.closest('.day-cell') : null;
    const toDate = cell ? cell.dataset.date : null;
    const willMove = !!(fromDate && toDate && toDate !== fromDate);

    dndCleanup(willMove);

    // 드래그가 끝난 직후의 클릭(=날짜 모달 열림)은 한 번 막아줌
    dnd.suppressClick = true;
    setTimeout(() => { dnd.suppressClick = false; }, 450);

    if (fromDate && toDate && toDate !== fromDate) {
      window.handleDayDrop(fromDate, toDate);
    }
  }

  const dndGrid = document.getElementById('calendar-grid');

  if (dndGrid) {
    // 드래그 직후 발생하는 클릭 삼키기 (캡처 단계라서 셀의 onclick보다 먼저 실행됨)
    dndGrid.addEventListener('click', (e) => {
      if (dnd.active || dnd.suppressClick) {
        e.stopPropagation();
        e.preventDefault();
      }
    }, true);

    // ---------- 마우스 ----------
    dndGrid.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      if (!currentUser && !localStorage.getItem('filmNote_user')) return;
      const cell = e.target.closest('.day-cell');
      if (!cell || !cell.dataset.date) return;
      if (dndLogsOf(cell.dataset.date).length === 0) return;

      dnd.isTouch = false;
      dnd.pending = true;
      dnd.fromDate = cell.dataset.date;
      dnd.startX = e.clientX;
      dnd.startY = e.clientY;
    });

    document.addEventListener('mousemove', (e) => {
      if (dnd.isTouch) return;
      if (dnd.pending && !dnd.active) {
        const dist = Math.hypot(e.clientX - dnd.startX, e.clientY - dnd.startY);
        if (dist > DND_MOUSE_THRESHOLD) dndBegin(dnd.fromDate, e.clientX, e.clientY);
        return;
      }
      if (dnd.active) {
        e.preventDefault();
        dndUpdate(e.clientX, e.clientY);
      }
    });

    document.addEventListener('mouseup', (e) => {
      if (dnd.isTouch) return;
      if (dnd.active) dndFinish(e.clientX, e.clientY);
      else if (dnd.pending) { dnd.pending = false; dnd.fromDate = null; }
    });

    // ---------- 터치 ----------
    dndGrid.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      if (!currentUser && !localStorage.getItem('filmNote_user')) return;
      const cell = e.target.closest('.day-cell');
      if (!cell || !cell.dataset.date) return;
      if (dndLogsOf(cell.dataset.date).length === 0) return;

      dnd.isTouch = true;
      dnd.pending = true;
      dnd.fromDate = cell.dataset.date;
      dnd.startX = e.touches[0].clientX;
      dnd.startY = e.touches[0].clientY;

      clearTimeout(dnd.longPressTimer);
      dnd.longPressTimer = setTimeout(() => {
        if (dnd.pending) dndBegin(dnd.fromDate, dnd.startX, dnd.startY);
      }, DND_LONG_PRESS_MS);
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (!dnd.isTouch) return;
      const t = e.touches[0];
      if (!t) return;

      if (dnd.pending && !dnd.active) {
        // 길게 누르기 전에 손가락이 움직였다면 스크롤/스와이프 의도로 보고 취소
        const dist = Math.hypot(t.clientX - dnd.startX, t.clientY - dnd.startY);
        if (dist > DND_TOUCH_SLOP) {
          clearTimeout(dnd.longPressTimer);
          dnd.pending = false;
          dnd.fromDate = null;
        }
        return;
      }

      if (dnd.active) {
        e.preventDefault(); // 드래그 중에는 화면이 같이 스크롤되지 않게
        dndUpdate(t.clientX, t.clientY);
      }
    }, { passive: false });

    document.addEventListener('touchend', (e) => {
      if (!dnd.isTouch) return;
      clearTimeout(dnd.longPressTimer);
      if (dnd.active) {
        const t = e.changedTouches[0];
        dndFinish(t ? t.clientX : dnd.startX, t ? t.clientY : dnd.startY);
      } else {
        dnd.pending = false;
        dnd.fromDate = null;
      }
    });

    document.addEventListener('touchcancel', () => {
      clearTimeout(dnd.longPressTimer);
      if (dnd.active) dndCleanup();
      else { dnd.pending = false; dnd.fromDate = null; }
    });
  }

  // 여러 기록이 있는 날짜를 옮길 때: 옮길 기록을 여러 개 골라서 한 번에 이동
  function pickRecordsToMove(logs, fromDate, toDate) {
    const sorted = sortLogsByTime(logs);

    const itemsHtml = sorted.map(log => {
      const poster = posterAt(log.poster || DEFAULT_POSTER, 'w185');
      const timeStr = (log.startTime || log.endTime)
        ? `${log.startTime || ''} ~ ${log.endTime || ''}`
        : '시간 미입력';
      return `
        <div class="move-pick-item" data-id="${dndEscape(log.id)}">
          <div class="move-pick-check">✓</div>
          <img src="${dndEscape(poster)}" width="34" height="48" onerror="this.onerror=null; this.src='${DEFAULT_POSTER}';">
          <div class="move-pick-body">
            <div class="move-pick-title">${dndEscape(log.title)}</div>
            <div class="move-pick-sub">${dndEscape(log.cinema || '영화관 미입력')} | ${dndEscape(timeStr)}</div>
          </div>
        </div>`;
    }).join('');

    return Swal.fire({
      title: 'Film Note',
      html: `
        <div class="move-pick-desc">
          ${fromDate} → <b>${toDate}</b><br>
          이 날의 기록 ${sorted.length}개 중<br>
          <b>어떤 기록을 옮기시겠어요?</b>
        </div>
        <div class="move-pick-selectall"><button type="button" id="movePickAllBtn">전체 선택</button></div>
        <div class="move-pick-list">${itemsHtml}</div>`,
      showCancelButton: true,
      showConfirmButton: true,
      confirmButtonText: '옮기기',
      cancelButtonText: '취소',
      confirmButtonColor: '#f2ebd9',
      cancelButtonColor: '#e9ecef',
      customClass: { popup: 'move-pick-popup' },
      // 클래스는 기본값 그대로 두고(SweetAlert2 내부 감지 로직이 깨지지 않게),
      // 위 CSS에서 팝업/배경 애니메이션 길이만 0.25s로 통일함.
      didOpen: () => {
        // 칸의 transition 복구는 애니메이션이 다 끝난 뒤로 미룸 (안 그러면 아직
        // 배경이 다 어두워지기 전에 칸이 원래 모습으로 돌아가며 반짝여 보임)
        setTimeout(flushPendingCellTransitions, 260);
        const cancelBtn = Swal.getCancelButton();
        if (cancelBtn) cancelBtn.style.color = '#333333';

        const popup = Swal.getPopup();
        const confirmBtn = Swal.getConfirmButton();
        const items = Array.from(popup.querySelectorAll('.move-pick-item'));
        const allBtn = popup.querySelector('#movePickAllBtn');

        const selectedIds = () => items.filter(el => el.classList.contains('selected')).map(el => el.dataset.id);

        const refresh = () => {
          const n = selectedIds().length;
          confirmBtn.disabled = n === 0;
          confirmBtn.innerText = n > 0 ? `${n}개 옮기기` : '옮기기';
          allBtn.innerText = (n === items.length) ? '전체 해제' : '전체 선택';
        };

        items.forEach(el => {
          el.addEventListener('click', () => {
            el.classList.toggle('selected');
            refresh();
          });
        });

        allBtn.addEventListener('click', () => {
          const selectAll = selectedIds().length !== items.length;
          items.forEach(el => el.classList.toggle('selected', selectAll));
          refresh();
        });

        refresh();
      },
      preConfirm: () => {
        const popup = Swal.getPopup();
        const ids = Array.from(popup.querySelectorAll('.move-pick-item.selected')).map(el => el.dataset.id);
        if (ids.length === 0) {
          Swal.showValidationMessage('옮길 기록을 하나 이상 선택해주세요');
          return false;
        }
        return ids;
      }
    }).then(result => (result.isConfirmed ? result.value : null));
  }

  window.handleDayDrop = async function(fromDate, toDate) {
    try {
      if (!(await requireLogin())) return;
      const logs = dndLogsOf(fromDate);
      if (logs.length === 0) return;

      let targetIds = null;

      if (logs.length === 1) {
        const result = await Swal.fire({
          title: 'Film Note',
          html: `
            <div class="move-pick-desc">
              <b class="move-confirm-title">${dndEscape(logs[0].title)}</b> 기록을<br>
              ${fromDate} → <b>${toDate}</b> 로<br>
              <b>옮길까요?</b>
            </div>`,
          // icon: 'question' 를 뺐음 — SweetAlert2의 아이콘은 그냥 그림이 아니라
          // 0.5~0.75초짜리 CSS 애니메이션(물음표가 튕기는 효과)이 있는데, 하필 그
          // 재생 시간 중에 데이터 갱신(onSnapshot)이 겹치면 프레임이 밀리면서
          // 깜빡이는 것처럼 보였음. 아이콘이 없는 다중 기록 팝업은 이 문제가 없었음.
          showCancelButton: true,
          confirmButtonText: '옮기기',
          cancelButtonText: '취소',
          confirmButtonColor: '#f2ebd9',
          cancelButtonColor: '#e9ecef',
          // 클래스는 기본값 그대로 두고, 위 CSS에서 애니메이션 길이만 통일함.
          didOpen: () => {
            setTimeout(flushPendingCellTransitions, 260);
            const cancelBtn = Swal.getCancelButton();
            if (cancelBtn) cancelBtn.style.color = '#333333';
          }
        });
        if (!result.isConfirmed) return;
        targetIds = [logs[0].id];
      } else {
        targetIds = await pickRecordsToMove(logs, fromDate, toDate);
      }

      if (!targetIds || targetIds.length === 0) return;
      await moveLogsToDate(targetIds, toDate);
    } finally {
      // 드래그로 시작된 이동 흐름(확인 팝업 포함)이 여기서 완전히 끝남.
      // 그동안 억제해뒀던 재렌더링을 이제 풀어주고, 그 사이에 다른 이유로
      // 데이터가 바뀌어 미뤄둔 게 있었다면 지금 딱 한 번만 반영함.
      // (취소했을 때도 반드시 여기서 풀어줘야 다음 번 갱신이 계속 미뤄지지 않음)
      dnd.suspendRerender = false;
      if (dnd.pendingRerender) {
        dnd.pendingRerender = false;
        renderCalendar();
      }
      // 안전망: 무슨 이유로든(팝업이 안 뜨고 중간에 return 되는 등) 위의 didOpen이
      // 한 번도 안 불렸다면, 칸이 transition:none인 채로 영원히 남지 않도록 여기서도 복구
      flushPendingCellTransitions();
    }
  };

  async function moveLogsToDate(ids, toDate) {
    // 옮겨가는 날짜에 이미 기록이 있으면, 대표 포스터가 둘이 되지 않게 해제해서 옮김
    const targetHasLogs = logsOfDate(toDate).length > 0;

    const batch = writeBatch(db);
    ids.forEach(id => {
      const payload = { date: toDate };
      if (targetHasLogs) payload.isMainPoster = false;
      batch.update(doc(db, "movieLogs", id), payload);
    });

    // 서버 응답을 기다리지 않음 (로컬 반영 + onSnapshot으로 화면은 바로 갱신됨)
    batch.commit().catch(e => {
      console.error("날짜 이동 실패:", e);
      Swal.fire({
        title: 'Film Note',
        text: '날짜 이동을 서버에 반영하지 못했습니다. 네트워크 상태를 확인해주세요.',
        icon: 'error',
        confirmButtonText: '확인',
        confirmButtonColor: '#f2ebd9'
      });
    });

    // 옮긴 날짜가 다른 달이면 그 달로 화면을 전환. 같은 달 안에서 옮긴 거라면
    // 여기서 다시 그리지 않음 — 이 시점엔 아직 실제 데이터(movieLogs)가
    // 갱신되기 전이라, 옛날 상태로 한 번 그려졌다가 바로 뒤이어 onSnapshot이
    // 진짜 결과를 반영하며 또 한 번 그려지면서 화면이 두 번 깜빡이는
    // 원인이었음. 같은 달이면 onSnapshot에 의한 한 번의 재렌더링만으로 충분함.
    const [ty, tm] = toDate.split('-').map(Number);
    const monthChangedForView = currentDate.getFullYear() !== ty || currentDate.getMonth() !== tm - 1;
    if (monthChangedForView) {
      currentDate = new Date(ty, tm - 1, 1);
      renderCalendar();
    }

    await Swal.fire({
      title: 'Film Note',
      html: `기록 ${ids.length}개를<br><b>${toDate}</b> 로 옮겼어요.`,
      // icon: 'success' 를 뺐음 — 체크마크가 그려지는 애니메이션(약 0.5~0.75초)이
      // 하필 데이터 갱신(onSnapshot) 타이밍과 겹칠 때 깜빡임으로 보였던 원인.
      confirmButtonText: '확인',
      confirmButtonColor: '#f2ebd9'
    });
  }

  // 화면을 다 그린 뒤에 Firebase를 로드하기 시작 (첫 페인트를 막지 않도록)
  let firebaseInitPromise = initFirebase().catch(e => {
    console.error("Firebase 초기화 완전 실패 (재시도 소진):", e);
  });

// 안드로이드 기기 판별 함수
  function isAndroid() {
    return /Android/i.test(navigator.userAgent);
  }
  
// 1. 안드로이드 뒤로가기 누를 때 가장 위에 있는 모달부터 순서대로 닫기
  window.addEventListener('popstate', function (e) {
    if (!isAndroid()) return; // 안드로이드가 아니면 무시
    
    if (typeof Swal !== 'undefined' && Swal.isVisible()) {
      Swal.close();
      return;
    }

    // ① 포스터 확대 화면(지정한 아이디나 클래스)이 열려있다면 이것부터 닫기!
    const posterModal = document.getElementById('posterModal');
    if (posterModal && window.getComputedStyle(posterModal).display !== 'none') {
      posterModal.style.display = 'none';
      return;
    }

    // ② 그 외 다른 모달들(.modal-overlay) 중 화면에 보이는 것 찾아서 닫기
    const modals = document.querySelectorAll('.modal-overlay');
    for (let i = modals.length - 1; i >= 0; i--) {
      if (window.getComputedStyle(modals[i]).display !== 'none') {
        modals[i].style.display = 'none';
        return;
      }
    }
  });

  // 2. SweetAlert2 팝업 열릴 때 자동 히스토리 추가
  if (typeof Swal !== 'undefined') {
    const originalFire = Swal.fire;
    Swal.fire = function (...args) {
      if (isAndroid()) {
        history.pushState({ swal: true }, '', '#popup');
      }
      return originalFire.apply(this, args);
    };
  }

  // 3. 모든 모달(포스터 모달 포함)이 열릴 때 자동으로 히스토리 추가
  const observer = new MutationObserver((mutations) => {
    if (!isAndroid()) return; // 안드로이드가 아니면 무시
    mutations.forEach((mutation) => {
      const target = mutation.target;
      if (target.id === 'posterModal' || (target.classList && target.classList.contains('modal-overlay'))) {
        const isVisible = window.getComputedStyle(target).display !== 'none';
        if (isVisible) {
          history.pushState({ modal: true }, '', '#modal');
        }
      }
    });
  });

  // 포스터 모달과 일반 모달들 모두 감시 대상에 등록
  const allModals = document.querySelectorAll('.modal-overlay, #posterModal');
  allModals.forEach(modal => {
    if (modal) {
      observer.observe(modal, { attributes: true, attributeFilter: ['style', 'class'] });
    }
  });

  // ===================== 모바일 키보드 대응 (모달이 키보드에 안 가리게 중앙 정렬) =====================
  // 모바일에서 입력창에 포커스가 가면 키보드가 올라오면서 실제 "보이는 화면 영역"이 줄어드는데,
  // 모달은 항상 전체 화면(100%) 기준으로 가운데 정렬되다보니 키보드에 팝업이 가려지는 문제가 있었음.
  // visualViewport API로 키보드를 뺀 실제 보이는 영역을 감지해서, 그 영역 안에서
  // 모달이 다시 가운데 오도록 위치/크기를 맞춰줌 (iOS/Android 브라우저 공통 지원. 미지원 브라우저는 그냥 기존 방식대로 동작).
  function syncModalToVisibleViewport() {
    if (!window.visualViewport) return;
    const vv = window.visualViewport;
    document.querySelectorAll('.modal-overlay, .poster-modal-overlay').forEach(overlay => {
      if (window.getComputedStyle(overlay).display === 'none') return;
      overlay.style.left = vv.offsetLeft + 'px';
      overlay.style.top = vv.offsetTop + 'px';
      overlay.style.width = vv.width + 'px';
      overlay.style.height = vv.height + 'px';

      // 모달 내용(.modal-card)이 키보드 때문에 줄어든 화면보다 커서 잘리는 일이 없도록
      // 최대 높이도 실제 보이는 영역 기준으로 같이 맞춰줌
      const card = overlay.querySelector('.modal-card');
      if (card) {
        card.style.maxHeight = Math.max(vv.height - 32, 120) + 'px';
      }
    });
  }

  function resetModalViewportStyle(overlay) {
    overlay.style.left = '';
    overlay.style.top = '';
    overlay.style.width = '';
    overlay.style.height = '';
    const card = overlay.querySelector('.modal-card');
    if (card) card.style.maxHeight = '';
  }

  if (window.visualViewport) {
    // 키보드가 올라오거나 내려갈 때(=보이는 영역 크기가 바뀔 때)마다 다시 계산
    window.visualViewport.addEventListener('resize', syncModalToVisibleViewport);
    window.visualViewport.addEventListener('scroll', syncModalToVisibleViewport);
  }

  // 모달이 열리고 닫힐 때도 바로 반영 (닫힐 땐 스타일을 초기화해서 다음에 열릴 때 새로 계산되게 함)
  const keyboardAwareObserver = new MutationObserver((mutations) => {
    mutations.forEach((mutation) => {
      const target = mutation.target;
      const isModal = target.classList && (target.classList.contains('modal-overlay') || target.classList.contains('poster-modal-overlay'));
      if (!isModal) return;

      const isVisible = window.getComputedStyle(target).display !== 'none';
      if (isVisible) {
        syncModalToVisibleViewport();
      } else {
        resetModalViewportStyle(target);
      }
    });
  });

  document.querySelectorAll('.modal-overlay, .poster-modal-overlay').forEach(overlay => {
    keyboardAwareObserver.observe(overlay, { attributes: true, attributeFilter: ['style', 'class'] });
  });
</script>
</body>
</html>
